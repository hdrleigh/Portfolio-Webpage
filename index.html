<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>welcome to my world</title>
<link href="https://fonts.googleapis.com/css2?family=Delicious+Handrawn&family=Bodoni+Moda:ital,wght@0,500;0,900;1,500&family=Questrial&family=Reenie+Beanie&family=Pacifico&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#e85a93;--baby:#f7c6d0;--butter:#f8e9a8;--ink:#4a2c20;--mint:#6fd6a0;--mag:#c2185b;--cream:#dedcd2;--gold:#d8a93a;
--f-title:'Delicious Handrawn',cursive;--f-chat:'Bodoni Moda',serif;--f-col:'Questrial',sans-serif;--f-hand:'Reenie Beanie',cursive;}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-snap-type:y proximity}
body{margin:0;color:var(--ink);font-family:var(--f-col);background:var(--pink);overflow-x:hidden}
#live{position:fixed;inset:0;z-index:0;pointer-events:none}
.scene{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:4vh 3vw 4vh 64px;scroll-snap-align:start}
.page{position:relative;width:min(1040px,100%);min-height:min(640px,88vh);background:var(--butter) repeating-linear-gradient(transparent 0 31px,#d9b8c066 31px 32px);border:3px solid var(--ink);border-radius:6px;box-shadow:10px 10px 0 var(--ink);padding:28px;transform:rotate(-.6deg)}
.scene:nth-child(even) .page{transform:rotate(.7deg)}
.page.pinkpg{background-color:var(--baby)}
.star{position:absolute;color:var(--mint);font-size:34px;animation:tw 2.4s infinite ease-in-out;text-shadow:2px 2px 0 var(--ink)}
@keyframes tw{50%{transform:scale(.6) rotate(25deg);opacity:.6}}
/* nav */
nav{position:fixed;left:10px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:10px}
nav button{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--ink);background:var(--mint);box-shadow:3px 3px 0 var(--ink);font:700 18px var(--f-hand);color:var(--ink);cursor:pointer;transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
nav button:hover,nav button:focus-visible{transform:scale(1.2) rotate(-12deg);outline:none;background:var(--gold)}
nav button:nth-child(odd){background:var(--baby)}
/* welcome */
#welcome .page{min-height:min(640px,88vh);overflow:hidden}
#cover{position:absolute;inset:0;container-type:inline-size}
.cw img{-webkit-user-drag:none;user-select:none}
.cw.title{line-height:.95;text-align:center;font-family:var(--f-title)}
.title-i .w{display:inline-block;white-space:nowrap}
.title-i span{display:inline-block;animation:pop .7s cubic-bezier(.3,1.8,.5,1) both,bob 3s ease-in-out infinite}
@keyframes pop{from{transform:translateY(-60px) scale(.2) rotate(-20deg);opacity:0}}
@keyframes bob{50%{transform:translateY(-6px) rotate(1.5deg)}}
.cw.girl>*{animation:float 5s ease-in-out infinite}
.cw.girl img,.cw.girl svg,.cw.cut img{width:100%;height:auto;display:block;pointer-events:none}
.cw.cut img{filter:drop-shadow(3px 5px 3px #0004)}
@keyframes float{50%{transform:translateY(-12px) rotate(2deg)}}
.legs{transform-origin:150px 190px;animation:swing 1.6s ease-in-out infinite}@keyframes swing{50%{transform:rotate(14deg)}}
.blink{animation:bl 4s infinite;transform-origin:center}@keyframes bl{96%,100%{transform:scaleY(1)}98%{transform:scaleY(.1)}}
.cw.note>.sticky{position:relative;background:#ffe45c;padding:.55em .45em;min-height:4em;font-weight:700;line-height:1.05;box-shadow:4px 6px 0 #0003;animation:flut 3s infinite ease-in-out;white-space:pre-wrap}
.cw.note>.sticky::before{content:"";position:absolute;top:-8px;left:50%;width:14px;height:14px;border-radius:50%;background:var(--mag);border:2px solid var(--ink)}
@keyframes flut{50%{transform:rotate(-3deg) translateY(-3px)}}
.cw.txt{white-space:pre-wrap}.cw.txt.hf h3{font-family:inherit}
/* chat */
.chat{max-width:560px;margin:0 auto;font-family:var(--f-chat)}
.row{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}.row.r{justify-content:flex-end}
.av{width:46px;height:46px;border-radius:50%;background:#cfd3da;flex:none;border:2px solid var(--ink);position:relative;overflow:hidden}
.av::before{content:"";position:absolute;left:14px;top:9px;width:16px;height:16px;border-radius:50%;background:#5b6578}.av::after{content:"";position:absolute;left:8px;top:28px;width:28px;height:24px;border-radius:50%;background:#5b6578}
.bub{padding:12px 22px;border-radius:26px;font-size:21px;border:2.5px solid var(--ink);animation:pop .6s cubic-bezier(.3,1.8,.5,1) both}
.bub.g{background:var(--mint);border-bottom-left-radius:4px}.bub.c{background:var(--cream);border-bottom-right-radius:4px}
.card{background:var(--cream);border:3px solid var(--ink);border-radius:34px;border-bottom-right-radius:6px;padding:20px 22px;box-shadow:6px 6px 0 var(--ink)}
.card h2{margin:0 0 14px;font:400 46px var(--f-chat);border-bottom:3px solid var(--ink);display:flex;gap:10px;align-items:baseline}
.card h2 b{font-weight:900;font-size:60px}.card h2 i{color:var(--mint);text-shadow:2px 2px 0 var(--ink);font-style:normal}
.tags{display:flex;flex-wrap:wrap;gap:9px}
.tag{font:17px var(--f-col);color:var(--ink);background:none;border:2.5px solid var(--mag);border-radius:30px;padding:6px 16px;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.tag:hover{transform:rotate(-3deg) scale(1.06)}.tag.gone{transform:scale(0);opacity:0;transition:.3s}
.tag::after{content:" x";opacity:.7}.tag.hi{color:#12985d}
/* collage */
#cstage{position:relative;height:640px;margin:0 auto}
.cw{position:absolute;touch-action:none;transition:transform .25s}
.cw.img{background:#fff;padding:6px 6px 26px;box-shadow:3px 5px 0 #0003;border:1px solid #0002}
.cw.img img,.cw.img .ph{width:100%;display:block;aspect-ratio:4/5;object-fit:cover}
.ph{background:linear-gradient(135deg,var(--baby),#b8e8d1);display:grid;place-items:center;font:30px var(--f-hand);color:var(--ink)}
.cw.txt{font-family:var(--f-col);line-height:1.35}
.cw.txt h3{font:900 clamp(34px,5vw,64px)/.9 var(--f-chat);margin:0 0 6px;letter-spacing:-2px;transform:scaleX(.8);transform-origin:left}
.edit .cw{outline:2px dashed var(--mag);cursor:grab}.edit .cw::after{content:"";position:absolute;right:-8px;bottom:-8px;width:18px;height:18px;background:var(--mag);border-radius:50%;cursor:nwse-resize}
/* bag */
#stage{position:relative;height:600px;max-width:760px;margin:0 auto}
#bagbtn{position:absolute;left:50%;top:6%;width:250px;margin-left:-125px;border:0;background:none;cursor:pointer;z-index:3;transition:transform 1s cubic-bezier(.4,1.5,.5,1);transform-origin:50% 50%;padding:0}
#bagbtn img,#bagbtn svg{width:100%;display:block}
.open #bagbtn{transform:rotate(180deg) translateY(10px)}
.bagnote{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font:34px var(--f-hand)}
.it{position:absolute;width:110px;transition:top 1.1s cubic-bezier(.3,1.5,.5,1),left 1.1s,transform 1.1s,opacity .4s;opacity:0;z-index:2}
.open .it{opacity:1}
.it img{width:100%;filter:drop-shadow(3px 5px 3px #0004);display:block}
.it:hover,.it:focus-within{z-index:9}.it:hover img{animation:wig .5s}@keyframes wig{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.tip{position:absolute;left:50%;bottom:105%;width:190px;margin-left:-95px;padding:10px 14px;border-radius:18px;border:2.5px solid var(--ink);text-align:left;pointer-events:none;transform:scale(0);transform-origin:50% 100%;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.it:hover .tip,.it.t .tip{transform:scale(1)}.tip b{display:block;font-size:1.2em}
/* doodle */
.dd{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:start}
.panel{background:var(--baby);border:3px solid var(--ink);border-radius:10px;box-shadow:5px 5px 0 var(--ink);padding:12px;font:11px var(--f-col);letter-spacing:.12em}
.panel h4{margin:10px 0 6px;font:inherit;border-bottom:1.5px solid var(--ink)}.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw i{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);cursor:pointer}.sw i.on{box-shadow:0 0 0 3px #fff}
.b{display:block;width:100%;margin:6px 0;padding:8px;border:2.5px solid var(--ink);border-radius:6px;font:inherit;cursor:pointer;background:var(--cream);color:var(--ink);box-shadow:2px 3px 0 var(--ink)}
.b.on{background:var(--ink);color:#fff}.b.pk{background:var(--pink);color:#fff}.b:active{transform:translate(2px,3px);box-shadow:none}
.frame{border:2px solid var(--ink);padding:7px;background:#fffdf0aa}
canvas#cv{display:block;width:100%;height:300px;border:2px dashed var(--ink);background:#fffdf3;touch-action:none;cursor:crosshair}
.frame textarea{width:100%;margin-top:8px;border:2px dashed var(--ink);background:#fffdf3;padding:8px;font:24px var(--f-hand);height:64px}
.sent{font:32px var(--f-hand);margin:6px 0 0;color:var(--mag)}
/* admin */
#adm{position:fixed;right:0;top:0;bottom:0;width:330px;max-width:92vw;z-index:50;background:#fff8ec;border-left:3px solid var(--ink);overflow:auto;padding:12px;font:13px var(--f-col);transform:translateX(100%);transition:transform .3s}
#adm.on{transform:none}#adm h3{margin:0 0 8px;font:30px var(--f-hand)}
#adm details{border:2px solid var(--ink);border-radius:8px;margin:8px 0;background:#fff}#adm summary{cursor:pointer;padding:8px 10px;font-weight:700;background:var(--baby)}
#adm .in{padding:8px 10px;display:grid;gap:6px}#adm label{display:grid;gap:2px}
#adm input,#adm select,#adm textarea{width:100%;font:inherit;padding:4px;border:1.5px solid var(--ink);border-radius:5px}#adm input[type=color]{height:30px;padding:0}
#adm button{font:inherit;padding:6px;border:2px solid var(--ink);border-radius:6px;background:var(--mint);cursor:pointer}
#adm .li{display:flex;justify-content:space-between;gap:6px;align-items:center;border-bottom:1px dashed #0004;padding:4px 0}#adm .li img{max-width:70px;max-height:50px}
#admtog{position:fixed;right:12px;bottom:12px;z-index:51;display:none;padding:10px 16px;border-radius:30px;border:2.5px solid var(--ink);background:var(--gold);font:700 15px var(--f-col);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
@media(max-width:700px){.scene{padding:3vh 8px 3vh 54px}.dd{grid-template-columns:1fr}#girl{width:34%}.page{padding:16px}.tip{width:150px;margin-left:-75px}.it{width:80px}}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;font:14px var(--f-col);opacity:0;transition:opacity .3s;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="live"></canvas>
<nav aria-label="pages"><button data-g="welcome" title="hello">hi</button><button data-g="about" title="about me">me</button><button data-g="collage" title="collage">mix</button><button data-g="bag" title="my bag">bag</button><button data-g="doodle" title="leave something">✎</button></nav>

<section class="scene" id="welcome"><div class="page"><span class="star" style="left:8%;top:10%">✦</span><span class="star" style="right:12%;bottom:18%;color:var(--gold)">✦</span><div id="cover"></div></div></section>

<section class="scene" id="about"><div class="page pinkpg"><div class="chat"><div class="row"><div class="av"></div><div class="bub g" id="c1"></div></div><div class="row r"><div class="bub c" id="c2"></div></div>
<div class="card"><h2><i>★</i>about <b>ME</b></h2><div class="tags" id="tags"></div></div></div></div></section>

<section class="scene" id="collage"><div class="page"><div id="cstage"></div></div></section>

<section class="scene" id="bag"><div class="page pinkpg"><div id="stage"><button id="bagbtn" aria-label="open my bag"></button><div class="bagnote">tap my bag!</div></div></div></section>

<section class="scene" id="doodle"><div class="page"><h2 style="font:48px var(--f-hand);margin:0 0 4px;text-align:center">leave something</h2><p style="font:26px var(--f-hand);text-align:center;margin:0 0 12px">doodle on the canvas or leave a sticky note!</p>
<div class="dd"><div class="panel"><h4>COLORS</h4><div class="sw" id="sw"></div><h4>TOOLS</h4><button class="b on" id="pen">✎ Pencil</button><button class="b" id="era">Eraser</button><h4>ACTIONS</h4><button class="b pk" id="send">+ Add Note</button><button class="b" id="clr">Clear All</button></div>
<div class="frame"><canvas id="cv" width="800" height="300"></canvas><textarea id="msg" placeholder="write me something..." maxlength="400"></textarea><div class="sent" id="sent"></div></div></div></div></section>

<div id="toast"></div><button id="admtog">✎ admin</button><aside id="adm" aria-label="admin"></aside>

<script>
const $=s=>document.querySelector(s),KEY='myworld_v1',PASS='bunny'; // CHANGE PASS (client-side only, see notes)
const svg=(b,w=100,h=100)=>'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}">${b}</svg>`);
const D={title:'welcome to my world',note:'fancy seeing you here',girl:null,bag:null,
chat1:'I want to know you',chat2:'Oh, sure! This is ...',tags:['INFJ','Virgo','Art','Blue','Pop Songs','Sushi'],
ty:{title:{f:'Delicious Handrawn',c:'#4a2c20',s:100},chat:{f:'Bodoni Moda',c:'#4a2c20',s:100},col:{f:'Questrial',c:'#4a2c20',s:100},hand:{f:'Reenie Beanie',c:'#4a2c20',s:100}},
bub:{f:'Reenie Beanie',c:'#4a2c20',bg:'#fff6c9',s:100},col:{pink:'#e85a93',butter:'#f8e9a8',ink:'#4a2c20',mint:'#6fd6a0'},
bg:{type:'gradient',c1:'#e85a93',c2:'#f7c6d0',img:null},fonts:[],
items:[{img:svg('<path d="M50 6l12 30 32 3-24 21 8 32-28-17-28 17 8-32L6 39l32-3z" fill="#e9b94a" stroke="#a37a1c" stroke-width="3"/>'),name:'gold star',desc:'replace me in admin!',x:12,y:52,r:-12},
{img:svg('<path d="M50 90C10 60 8 30 28 20c12-5 22 2 22 12 0-10 10-17 22-12 20 10 18 40-22 70z" fill="#ff8fb3" stroke="#c2185b" stroke-width="4"/>'),name:'glass heart',desc:'add your own cut-outs',x:70,y:46,r:10},
{img:svg('<rect x="30" y="10" width="40" height="80" rx="10" fill="#e85a93" stroke="#4a2c20" stroke-width="4"/><rect x="38" y="4" width="24" height="14" fill="#f8e9a8" stroke="#4a2c20" stroke-width="3"/>'),name:'lip balm',desc:'always in the bag',x:40,y:76,r:8}],
bubs:0,cover:[{t:'girl',core:1,x:67,y:1,w:30,r:0},{t:'title',core:1,x:6,y:30,w:60,r:0},{t:'note',core:1,x:3,y:70,w:14,r:-5}],cw:[{t:'txt',h:'FLETA',x:3,y:3,w:44,html:'A little world with its own rules. Edit this block in admin to say anything you like.',r:0},
{t:'img',x:6,y:34,w:20,r:-4},{t:'img',x:30,y:28,w:26,r:3},{t:'img',x:62,y:8,w:30,r:-2},{t:'img',x:60,y:50,w:28,r:4}],msgs:[]};
function merge(a,b){for(const k in b)a[k]=(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object')?merge(a[k],b[k]):b[k];return a}
let S;try{S=merge(JSON.parse(JSON.stringify(D)),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=JSON.parse(JSON.stringify(D))}
let API=false,PW='',REMOTE=false,tm;const hdr=()=>({'x-admin':PW});
const flash=m=>{const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(flash.t);flash.t=setTimeout(()=>t.style.opacity=0,1800)};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!API)alert('Browser storage is full. Remove a few big images, or export your settings.')}if(API&&isAdmin()){clearTimeout(tm);tm=setTimeout(push,700)}};
async function push(){const{msgs,...rest}=S;try{const r=await fetch('/api/state',{method:'PUT',headers:{...hdr(),'content-type':'application/json'},body:JSON.stringify(rest)});flash(r.ok?'saved ✓':'could not save ('+r.status+')')}catch(e){flash('could not save')}}
async function boot(){try{const c=new AbortController();setTimeout(()=>c.abort(),4000);const r=await fetch('/api/state',{cache:'no-store',signal:c.signal});if(r.ok){const j=await r.json();API=true;if(j&&Object.keys(j).length){REMOTE=true;S=merge(JSON.parse(JSON.stringify(D)),j)}}}catch(e){}}
const fmt=d=>{const x=new Date(d);return isNaN(x)?d:x.toLocaleString()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isAdmin=()=>$('#adm').dataset.ok==='1';

/* fonts */
const BUILT=['Delicious Handrawn','Bodoni Moda','Questrial','Reenie Beanie','Pacifico','Gaegu'];
const LF=new Set();function loadFonts(){S.fonts.forEach(f=>{if(LF.has(f.name))return;LF.add(f.name);new FontFace(f.name,`url("${f.url||f.data}")`).load().then(x=>{document.fonts.add(x);theme();rCover();rBag();rCollage()}).catch(()=>{LF.delete(f.name);console.warn('font failed',f.name)})})}
const allFonts=()=>BUILT.concat(S.fonts.map(f=>f.name));

/* theme */
function theme(){const r=document.documentElement.style,t=S.ty;
r.setProperty('--pink',S.col.pink);r.setProperty('--butter',S.col.butter);r.setProperty('--ink',S.col.ink);r.setProperty('--mint',S.col.mint);
for(const k in t)r.setProperty('--f-'+k,`"${t[k].f}",cursive,serif`);
document.querySelector('.chat').style.cssText=`font-family:var(--f-chat);color:${t.chat.c};font-size:${t.chat.s}%`;
$('#cstage').style.cssText+=`;color:${t.col.c};font-size:${16*t.col.s/100}px`;
const b=S.bg;document.body.style.background=b.type==='image'&&b.img?`url(${b.img}) center/cover fixed`:`linear-gradient(135deg,${b.c1},${b.c2},${b.c1}) fixed`;
document.body.style.backgroundSize=b.type==='gradient'?'300% 300%':'cover';document.body.style.animation=b.type==='gradient'?'gm 14s ease-in-out infinite':'none'}
document.head.insertAdjacentHTML('beforeend','<style>@keyframes gm{50%{background-position:100% 100%}}</style>');

/* scenes */
const girlSVG=`<svg viewBox="0 0 300 300"><defs><radialGradient id="pl" cx=".35" cy=".3"><stop offset="0" stop-color="#ffb3d9"/><stop offset="1" stop-color="#b58ae0"/></radialGradient></defs><circle cx="150" cy="250" r="110" fill="url(#pl)" stroke="#4a2c20" stroke-width="4"/>
<g class="legs"><path d="M130 175c-30 20-60 20-80 40M165 175c20 20 50 25 70 50" stroke="#4a2c20" stroke-width="22" stroke-linecap="round" fill="none"/><path d="M130 175c-30 20-60 20-80 40M165 175c20 20 50 25 70 50" stroke="#5b7fa6" stroke-width="16" stroke-linecap="round" fill="none"/></g>
<path d="M118 110h60l8 70h-76z" fill="#fff5f0" stroke="#4a2c20" stroke-width="4"/><path d="M95 40c-30 60-20 130 5 160l20-60zM205 40c30 60 20 130-5 160l-20-60z" fill="#6b3a24" stroke="#4a2c20" stroke-width="4"/>
<ellipse cx="150" cy="75" rx="40" ry="46" fill="#e9a883" stroke="#4a2c20" stroke-width="4"/><path d="M108 70c10-45 74-45 84 0-20-14-60-14-84 0z" fill="#6b3a24"/>
<g class="blink"><ellipse cx="135" cy="80" rx="5" ry="7" fill="#4a2c20"/><ellipse cx="165" cy="80" rx="5" ry="7" fill="#4a2c20"/></g><path d="M138 98q12 10 24 0" stroke="#c2185b" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;
const bagSVG=`<svg viewBox="0 0 250 240"><path d="M70 70C60 -10 190 -10 180 70" fill="none" stroke="#2b1a14" stroke-width="10"/><path d="M30 90q95-30 190 0l14 110q-109 40-218 0z" fill="#5b3a40" stroke="#2b1a14" stroke-width="5"/><rect x="60" y="130" width="130" height="50" rx="10" fill="#6d4950" stroke="#2b1a14" stroke-width="4"/><circle cx="195" cy="120" r="12" fill="#f8e9a8" stroke="#2b1a14" stroke-width="3"/></svg>`;
const fsz=c=>c.t==='title'?c.w*.17*S.ty.title.s/100+'cqw':c.t==='note'?c.w*.2*(c.s||100)/100+'cqw':'';
function mk(c,arr){const d=document.createElement('div');d.className='cw '+c.t+(c.f?' hf':'');d._ref=c;d._arr=arr;d.style.cssText=`left:${c.x}%;top:${c.y}%;width:${c.w}%;transform:rotate(${c.r||0}deg)`;
const fam=c.f?`font-family:"${c.f}",cursive;`:'',col=c.c?`color:${c.c};`:'',sc=c.s||100;
if(c.t==='title'){d.style.fontSize=fsz(c);d.style.color=S.ty.title.c;d.innerHTML='<div class="title-i">'+S.title.split(' ').map((w,k)=>`<span class="w">${[...w].map((ch,i)=>`<span style="animation-delay:${(k*5+i)*.06}s,${(k*5+i)*.06+.7}s">${esc(ch)}</span>`).join('')}</span> `).join('')+'</div>'}
else if(c.t==='girl')d.innerHTML=`<div>${S.girl?`<img src="${S.girl}" alt="">`:girlSVG}</div>`;
else if(c.t==='note'){d.style.cssText+=`;font-size:${fsz(c)};${fam}${col||'color:'+S.ty.hand.c+';'}`;if(!c.f)d.style.fontFamily='var(--f-hand)';d.innerHTML=`<div class="sticky">${esc(c.txt!==undefined?c.txt:S.note)}</div>`}
else if(c.t==='cut')d.innerHTML=`<img src="${c.src}" alt="">`;

let Z=10;function editable(st,rr){st.addEventListener('pointerdown',e=>{if(!st._ed)return;const d=e.target.closest('.cw');if(!d)return;e.preventDefault();const c=d._ref,R=st.getBoundingClientRect(),b=d.getBoundingClientRect(),rz=e.clientX>b.right-14&&e.clientY>b.bottom-14,sx=e.clientX,sy=e.clientY,ox=c.x,oy=c.y,ow=c.w;d.style.zIndex=++Z;d.setPointerCapture(e.pointerId);
const mv=m=>{const dx=(m.clientX-sx)/R.width*100,dy=(m.clientY-sy)/R.height*100;if(rz){c.w=Math.max(6,ow+dx);d.style.width=c.w+'%';const f=fsz(c);if(f)d.style.fontSize=f}else{c.x=ox+dx;c.y=oy+dy;d.style.left=c.x+'%';d.style.top=c.y+'%'}};
const up=()=>{d.removeEventListener('pointermove',mv);d.removeEventListener('pointerup',up);d._arr.push(d._arr.splice(d._arr.indexOf(c),1)[0]);save()};d.addEventListener('pointermove',mv);d.addEventListener('pointerup',up)});

const cv=$('#cv'),cx=cv.getContext('2d'),cols=['#4a2c20','#e85a93','#6fd6a0','#d8a93a','#ffffff'];let col=cols[0],era=false,dn=false;
cx.lineCap=cx.lineJoin='round';cols.forEach((c,i)=>{const s=document.createElement('i');s.style.background=c;if(!i)s.className='on';s.onclick=()=>{col=c;era=false;$('#era').classList.remove('on');$('#pen').classList.add('on');document.querySelectorAll('#sw i').forEach(x=>x.classList.remove('on'));s.classList.add('on')};$('#sw').append(s)});
$('#pen').onclick=()=>{era=false;$('#pen').classList.add('on');$('#era').classList.remove('on')};$('#era').onclick=()=>{era=true;$('#era').classList.add('on');$('#pen').classList.remove('on')};
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
cv.onpointerdown=e=>{dn=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);cx.beginPath();cx.moveTo(x,y)};
cv.onpointermove=e=>{if(!dn)return;const[x,y]=pt(e);cx.globalCompositeOperation=era?'destination-out':'source-over';cx.strokeStyle=col;cx.lineWidth=era?22:4;cx.lineTo(x,y);cx.stroke()};
cv.onpointerup=()=>dn=false;$('#clr').onclick=()=>{cx.clearRect(0,0,800,300);$('#msg').value=''};
$('#send').onclick=()=>{const blank=!cx.getImageData(0,0,800,300).data.some((v,i)=>i%4==3&&v);const t=$('#msg').value.trim();if(blank&&!t){$('#sent').textContent='draw or write something first!';return}
const m={text:t,img:blank?null:cv.toDataURL('image/png'),date:new Date().toISOString()};const done=()=>{cx.clearRect(0,0,800,300);$('#msg').value='';$('#sent').textContent='sent! thank you ♡'},bad=()=>$('#sent').textContent='oops, that didn’t send. try again?';
if(API){fetch('/api/messages',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(m)}).then(r=>r.ok?done():bad()).catch(bad)}else{S.msgs.unshift(m);save();done()}};

const fileURL=(f,max=900)=>new Promise(res=>{const r=new FileReader();r.onload=()=>{if(!f.type.startsWith('image/')||f.type==='image/svg+xml'||f.type==='image/gif')return res(r.result);const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL(f.type==='image/jpeg'?'image/jpeg':'image/png',.85))};i.src=r.result};r.readAsDataURL(f)});
async function host(b,name){const r=await fetch('/api/upload?name='+encodeURIComponent(name||'file'),{method:'POST',headers:{...hdr(),'content-type':b.type||'application/octet-stream'},body:b});if(!r.ok)throw new Error(r.status===413?'file too big (limit about 4MB)':'upload failed ('+r.status+')');return(await r.json()).url}
